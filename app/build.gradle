plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    compileOnly 'org.projectlombok:lombok:1.18.42'
annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.media' ]
}

// ============================================================
// 配布用
// ============================================================

// HUMMING 直下の調整ファイルを jar の /config/ に組み込む（配布したゲームでは ProjectFiles がこれを使う）
tasks.named('processResources') {
    from(rootProject.file('player_config.properties')) { into 'config' }
    from(rootProject.file('effect_config.properties')) { into 'config' }
    from(rootProject.file('ui_config.properties')) { into 'config' }
}

def jpackageDir = layout.buildDirectory.dir('jpackage')
def jpackageJdk = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.metadata.installationPath.asFile }
// 使う Java（Zulu の FX 版など）が JavaFX を持っているか。持っていれば、それを同梱する
// （そういう Java は、ほかの JavaFX を読み込もうとすると止まるため）
def jdkHasJavaFx = { new File(jpackageJdk.get(), 'jmods/javafx.base.jmod').exists() }
def javaFxModules = 'javafx.controls,javafx.fxml,javafx.media'

// jpackage に渡すファイルを集める。Java が JavaFX を持っていないときは、JavaFX を javafx/ フォルダに分けて、起動するときにモジュールとして読み込む
tasks.register('prepareJpackage', Sync) {
    group = 'distribution'
    description = 'jpackage に渡すファイルを build/jpackage/input に集める'
    def runtimeJars = configurations.runtimeClasspath
    def isJavaFx = { File f -> f.name.startsWith('javafx-') }
    from(tasks.named('jar'))
    from(runtimeJars.filter { !isJavaFx(it) })
    into('javafx') {
        // 中身のある、この OS 用の JavaFX だけ（javafx-base-25-win.jar など）
        from(runtimeJars.filter { isJavaFx(it) && it.name.contains('-win') && !jdkHasJavaFx() })
    }
    into jpackageDir.map { it.dir('input') }
}

// Java ごと同梱した、ダブルクリックで遊べるフォルダ（build/jpackage/HUMMING/HUMMING.exe）を作る
// 使い方: gradlew jpackageImage （Windows で実行すると Windows 用ができる）
tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Java 入りの配布用フォルダ build/jpackage/HUMMING を作る'
    dependsOn 'prepareJpackage'
    def inputDir = jpackageDir.map { it.dir('input') }
    def outputDir = jpackageDir.map { it.dir('HUMMING') }
    doFirst {
        delete outputDir // 前に作ったものが残っていると jpackage が止まるので消す
        executable = new File(jpackageJdk.get(), 'bin/jpackage')
        // 同梱する Java は、このゲームと JavaFX が使う部品だけにする（全部入れると 300MB を超える）
        def runtimeModules = 'java.base,java.desktop,java.logging,java.xml,java.scripting,jdk.unsupported'
        def javaFxOptions = jdkHasJavaFx()
                ? [] // Java の中の JavaFX を同梱する（下の --add-modules に足す）
                : ['--java-options', '--module-path=$APPDIR/javafx',
                   '--java-options', "--add-modules=${javaFxModules}"]
        args = [
            '--type', 'app-image',
            '--name', 'HUMMING',
            '--app-version', '1.0.0',
            '--input', inputDir.get().asFile.path,
            '--main-jar', tasks.named('jar').get().archiveFileName.get(),
            '--main-class', 'org.example.App',
            '--icon', file('packaging/HUMMING.ico').path, // exe のアイコン（images/icon/ と同じハチドリ）
            *javaFxOptions,
            '--java-options', '--enable-native-access=javafx.graphics,javafx.media',
            '--add-modules', jdkHasJavaFx() ? "${runtimeModules},${javaFxModules}" : runtimeModules,
            '--dest', jpackageDir.get().asFile.path,
        ]
    }
}
