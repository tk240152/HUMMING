# ==========================================
# ハチドリ操作感・調整ファイル
# ==========================================
bird.startX = 360.0
bird.startY = 240.0
bird.beakLength = 97.0

# 押し始めの加速度（1更新で速度に加える量）
bird.baseAcc = 0.6

# 押し続けたときの最大加速度。baseAcc 以上にする（風・雨の倍率を掛ける前の値）
bird.maxAcc = 5.0

# 加速度が1秒あたりに増える量。0なら初期加速度のまま
bird.accGrowthPerSecond = 1.0

# 移動方向と逆の入力をしたときの減速量（1更新あたり）。停止後は baseAcc で再発進
bird.brakeAcc = 0.3

bird.baseFriction = 0.98
bird.maxSpeed = 20.0

bird.tiltFactor = 0.023
bird.maxTiltAngle = 0.40

bird.hoverBobAmount = 0.03
bird.hoverBobSpeed = 5.0

bird.wallBounce = 0.5

# --- アイドル円運動パラメータ ---
idle.speed = 2.5
idle.radiusX = 25.0
idle.radiusY = 30.0

# --- 羽ばたき ---
# 1秒に羽ばたく回数。大きいほど速い
wing.flapsPerSecond = 80.0
# 羽が上下に振れる角度（度）。画像の羽で使う
wing.flapDegrees = 180
