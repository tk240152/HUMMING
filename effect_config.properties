# ==========================================
# 吸蜜エフェクト（蜜の粒）の調整ファイル
# 数値を書き換えて保存し、ゲーム画面で R キーを押すと反映される
# ==========================================
# 1秒に出る粒の数
feeding.rate = 25
# 吸い始めにはじける粒の数（0 ではじけない）
feeding.burstCount = 14
# 花からくちばしに届く秒数
feeding.travelSeconds = 0.4
# くちばしの上を顔まで流れる秒数
feeding.slideSeconds = 0.28
# 粒の大きさ（半径 px）の範囲
feeding.sizeMin = 3.0
feeding.sizeMax = 6.0
# 白く光る粒の割合（0.0〜1.0）
feeding.sparkleRatio = 0.25
# 十字のきらめきが1秒に出る数（0 で出ない）
feeding.crossPerSecond = 6
# 粒が出る範囲の半径（花の入り口から、px）
feeding.spawnRadius = 19
# 粒の色（カンマ区切り）
feeding.colors = #ffd166, #ffa502
